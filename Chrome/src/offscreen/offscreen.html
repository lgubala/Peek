<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Peek engine</title>
</head>
<body>
<!--
  Chrome MV3 service workers have no DOM, and Peek cannot parse HTML without
  one, so this invisible document hosts the engine instead.

  The scripts below are the same files, in the same order, that Firefox loads
  in its background page — Firefox/manifest.json "background.scripts", minus
  its background/index.js entry, which offscreen.js replaces.

  This list is generated, not hand-maintained: after changing the Firefox
  background scripts, run

      python3 docs/sync-offscreen.py

  A module missing here fails only in Chrome, and only at runtime.
-->
  <script src="../../src/common/log.js"></script>
  <script src="../../src/config/rules.js"></script>
  <script src="../../src/config/sites.js"></script>
  <script src="../../src/config/trackers.js"></script>
  <script src="../../src/platform/dom.js"></script>
  <script src="../../src/common/text.js"></script>
  <script src="../../src/common/url.js"></script>
  <script src="../../src/common/policy.js"></script>
  <script src="../../vendor/readability.js"></script>
  <script src="../../src/extract/jsonld.js"></script>
  <script src="../../src/extract/types.js"></script>
  <script src="../../src/extract/index.js"></script>
  <script src="../../src/reader/images.js"></script>
  <script src="../../src/reader/sanitize.js"></script>
  <script src="../../src/reader/tidy.js"></script>
  <script src="../../src/reader/serialize.js"></script>
  <script src="../../src/reader/index.js"></script>
  <script src="../../src/sites/index.js"></script>
  <script src="../../src/sites/github.js"></script>
  <script src="../../src/reader/signals.js"></script>
  <script src="../../src/background/gate.js"></script>
  <script src="../../src/background/cache.js"></script>
  <script src="../../src/background/fetcher.js"></script>
  <script src="../../src/background/pipeline.js"></script>
  <script src="offscreen.js"></script>
</body>
</html>
