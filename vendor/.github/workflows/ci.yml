# What this does, and why each step is here.
#
# Peek is distributed through addons.mozilla.org and the Chrome Web Store, so
# CI does not produce a downloadable build — there is nobody to hand it to.
# What it does is answer, on every push, the four questions that have actually
# bitten this project:
#
#   1. Does every file still parse, in both browsers?
#   2. Do the committed Chrome/ and Firefox/ folders match src/?
#      They are generated, and they are what gets uploaded to the stores. A
#      stale one means shipping code nobody reviewed.
#   3. Do the tests pass? Twice a module was wired into one browser and not
#      the other, failing only at runtime, only in Chrome.
#   4. Would the store linter reject the submission? Cheaper to learn here
#      than three days into a review queue.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # build.py is plain stdlib; any 3.x will do.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: npm ci

      - name: Every file parses
        run: npm run syntax

      # Chrome/ and Firefox/ are generated and committed so the repo can be
      # loaded directly and uploaded directly. This proves they are what src/
      # says they should be.
      - name: Committed builds match the source
        run: npm run check

      - name: Tests
        run: npm test

  store-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Catches what our own tests cannot: manifest schema, deprecated APIs,
      # and the warnings AMO reports on submission.
      - name: web-ext lint
        run: npx --yes web-ext lint --source-dir Firefox --warnings-as-errors=false
